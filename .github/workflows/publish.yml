name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Brave
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install --yes brave-browser

      - name: Verify package
        run: deno task verify:all
        env:
          BRAVE_ORIGIN_EXECUTABLE: /usr/bin/brave-browser
          CI: true

      - name: Prepare release metadata
        shell: bash
        run: |
          npm pkg set repository.type=git
          npm pkg set repository.url="git+https://github.com/${GITHUB_REPOSITORY}.git"
          npm pkg set homepage="https://github.com/${GITHUB_REPOSITORY}#readme"
          npm pkg set bugs.url="https://github.com/${GITHUB_REPOSITORY}/issues"
          deno run --allow-env --allow-read scripts/check-release.ts "${GITHUB_REF_NAME}"
          NPM_TAG=$(deno run --allow-read scripts/npm-dist-tag.ts)
          test -n "${NPM_TAG}"
          echo "NPM_TAG=${NPM_TAG}" >> "$GITHUB_ENV"

      - name: Check NPM package
        run: npm publish --dry-run --tag "${NPM_TAG}"

      - name: Check JSR package
        run: deno publish --dry-run --allow-dirty

      - name: Check NPM release status
        id: npm_release
        shell: bash
        run: |
          NPM_NAME=$(deno eval --no-config 'const { name } = JSON.parse(await Deno.readTextFile("package.json")); console.log(name)')
          NPM_VERSION=$(deno eval --no-config 'const { version } = JSON.parse(await Deno.readTextFile("package.json")); console.log(version)')
          PUBLISHED_VERSION=$(npm view "${NPM_NAME}@${NPM_VERSION}" version --json 2>/dev/null || true)
          if [[ "${PUBLISHED_VERSION}" == "\"${NPM_VERSION}\"" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NPM_NAME}@${NPM_VERSION} is already published; skipping the immutable NPM version."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check JSR release status
        id: jsr_release
        shell: bash
        run: |
          JSR_PUBLISHED=$(deno run --allow-read=deno.json --allow-net=jsr.io scripts/jsr-version-published.ts)
          echo "published=${JSR_PUBLISHED}" >> "$GITHUB_OUTPUT"

      - name: Publish to NPM
        if: steps.npm_release.outputs.published != 'true'
        run: npm publish --tag "${NPM_TAG}"

      - name: Publish to JSR
        if: steps.jsr_release.outputs.published != 'true'
        run: deno publish --allow-dirty

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi

          RELEASE_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${RELEASE_FLAGS[@]}"
